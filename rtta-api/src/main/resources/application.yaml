spring:
  application:
    name: dorriss
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${RTTA_DB_HOST:localhost}:${RTTA_DB_PORT:5432}/${RTTA_DB_NAME:rtta}
    username: ${RTTA_DB_USER:rtta}
    password: ${RTTA_DB_PASSWORD:}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  main:
    banner-mode: off

logging:
  level:
    root: WARN
    com.rtta.dorriss.audio: INFO
    com.rtta.dorriss.translation: INFO

rtta:
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.7-flash}
      deep-model: ${GEMINI_DEEP_MODEL:}
      embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
  translation:
    provider: ${RTTA_TRANSLATION_PROVIDER:azure}
    source-language: ${SPEECH_SOURCE_LANGUAGE:en-US}
    target-language: ${SPEECH_TARGET_LANGUAGE:vi}
    development-session-limit: ${RTTA_TRANSLATION_DEVELOPMENT_SESSION_LIMIT:120s}
    phrase-list:
      # Intentionally disabled by default; domain-context integration will be revisited in S06.
      enabled: ${RTTA_TRANSLATION_PHRASE_LIST_ENABLED:false}
      weight: ${RTTA_TRANSLATION_PHRASE_LIST_WEIGHT:1.1}
      terms: ${RTTA_TRANSLATION_PHRASE_LIST_TERMS:pulsar,neutron star,radio telescope,magnetic field}
    azure:
      key: ${SPEECH_KEY:}
      region: ${SPEECH_REGION:koreacentral}
      sdk-log-file: ${RTTA_TRANSLATION_AZURE_SDK_LOG_FILE:}

spike:
  enabled: false
  speech:
    key: ${SPEECH_KEY:}
    endpoint: ${SPEECH_ENDPOINT:https://koreacentral.api.cognitive.microsoft.com/}
    region: ${SPEECH_REGION:koreacentral}
    source-language: ${SPEECH_SOURCE_LANGUAGE:en-US}
    target-language: ${SPEECH_TARGET_LANGUAGE:vi}
    phrase-list:
      enabled: ${SPIKE_PHRASE_LIST_ENABLED:false}
      weight: ${SPIKE_PHRASE_LIST_WEIGHT:1.5}
      terms: ${SPIKE_PHRASE_LIST_TERMS:eigenstate,eigenstates,eigenvalue,eigenvalues,eigenfunction,Hamiltonian,quantum state,wave function,Schrodinger equation,Schrödinger equation}
  audio:
    path: ${SPIKE_AUDIO_PATH:./samples/physics.pcm}
    seconds-limit: ${SPIKE_AUDIO_SECONDS_LIMIT:20}
    chunk-ms: ${SPIKE_CHUNK_MS:50}
  sample:
    title: "Stationary states: key equations"
    excerpt-start: "00:14:24.180"
    excerpt-end: "00:14:38.940"
